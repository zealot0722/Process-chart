<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOP Studio Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useState, useRef } = React;

      const LOCAL_SAVE_KEY = 'sop_studio_local_draft';
      const SEARCH_PANEL_WIDTH = 320;

      const STYLE_OPTIONS = {
        backgrounds: [
          { name: '白色', value: 'bg-white' },
          { name: '淺灰', value: 'bg-slate-50' },
          { name: '淺藍', value: 'bg-blue-50' },
          { name: '淺綠', value: 'bg-emerald-50' },
          { name: '淺黃', value: 'bg-amber-50' },
          { name: '淺紫', value: 'bg-violet-50' },
          { name: '淺紅', value: 'bg-rose-50' },
        ],
        borders: [
          { name: '灰色', value: 'border-slate-200' },
          { name: '藍色', value: 'border-blue-500' },
          { name: '綠色', value: 'border-emerald-500' },
          { name: '黃色', value: 'border-amber-500' },
          { name: '紫色', value: 'border-violet-500' },
          { name: '紅色', value: 'border-rose-500' },
        ],
        fonts: [
          { name: '黑體 (Sans)', value: 'font-sans' },
          { name: '宋體 (Serif)', value: 'font-serif' },
          { name: '等寬 (Mono)', value: 'font-mono' },
        ],
        sizes: [
          { name: '小', value: 'text-sm' },
          { name: '中', value: 'text-base' },
          { name: '大', value: 'text-lg' },
          { name: '特大', value: 'text-xl' },
        ]
      };

      const initialPages = [
        {
          id: "page-rcv",
          name: "驗收站點 (RCV)",
          root: {
            id: "root-rcv",
            title: "驗收站點作業總覽",
            description: "主要處理的貨物稱為NYR(Not Yet Receive)。\n需依商品大小及數量區分板驗及散驗。",
            notes: "驗收量需大於碼頭的卸貨量，否則會造成碼頭塞車。\n若有多餘人力，需要觀察上架暫存區是否足夠。",
            type: "role",
            isOpen: true,
            images: [],
            links: [],
            style: { bgColor: "bg-white", borderColor: "border-blue-500", fontFamily: "font-sans", titleSize: "text-2xl", contentSize: "text-base" },
            children: [
              {
                id: "process-loose",
                title: "1. 散驗作業流程",
                description: "驗收員會在輸送帶旁的工作台進行商品驗收與決定入庫位置。\n可裝入物流箱的為散貨。",
                notes: "商品品名、外觀、規格是否與系統一致？商品是否需要效期？",
                type: "process",
                isOpen: false,
                images: [],
                links: [],
                style: { bgColor: "bg-white", borderColor: "border-blue-500", fontFamily: "font-sans", titleSize: "text-xl", contentSize: "text-base" },
                children: [
                  { id: "step1", title: "步驟 1：啟動輸送帶", description: "按下綠色按鈕啟動輸送帶。", type: "step", isOpen: false, children: [] },
                  { id: "step2", title: "步驟 2：開啟系統", description: "打開 worker tool，選擇「入庫」。", type: "step", isOpen: false, children: [] },
                  { id: "step3", title: "步驟 3：刷讀條碼", description: "依序刷：1.工作台 2.IBC 3.商品。", type: "step", isOpen: false, children: [] },
                  { id: "step4", title: "步驟 4：商品檢核", description: "檢查外觀、品名、效期。", notes: "⚠️ 效期需大於系統顯示日期。", type: "step", isOpen: false, children: [] },
                  { id: "step5", title: "步驟 5：裝箱", description: "驗收後放入物流箱。", notes: "⚠️ 注意不要超過限高線。", type: "step", isOpen: false, children: [] },
                  { id: "step6", title: "步驟 6：輸入數量", description: "輸入數量與選擇儲位。", type: "step", isOpen: false, children: [] },
                  { id: "step7", title: "步驟 7：確認入庫", description: "掃物流箱條碼。", type: "step", isOpen: false, children: [] },
                  { id: "step8", title: "步驟 8：資料查驗", description: "確認資料正確，點選入庫。", type: "step", isOpen: false, children: [] },
                  { id: "step9", title: "步驟 9：完成作業", description: "將物流箱推入輸送帶。", type: "step", isOpen: false, children: [] }
                ]
              },
              {
                id: "process-pallet",
                title: "2. 板驗作業流程",
                description: "負責棧板貨物的驗收、分類與入庫作業。\n區分為廠內用 (RCRT) 與轉出專用 (GCGP/GCGT)。",
                notes: "【關鍵規範】\n• 板驗人員標示請用「白色膠帶」。\n• 驗效期以「抽查四角與中間」方式進行。",
                type: "process",
                isOpen: false,
                images: [],
                links: [],
                style: { bgColor: "bg-white", borderColor: "border-purple-500", fontFamily: "font-sans", titleSize: "text-xl", contentSize: "text-base" },
                children: [
                  {
                    id: "pallet-common",
                    title: "板驗通用流程 (步驟 1-9)",
                    description: "所有板驗貨物皆須執行的標準系統操作步驟。",
                    type: "process",
                    isOpen: true,
                    children: [
                      { id: "p-step1", title: "① 開啟系統", description: "開啟 WMS 系統驗收功能 (板驗台)。", type: "step", isOpen: false, children: [] },
                      { id: "p-step2", title: "② 刷入工作檯", description: "刷入工作檯分類條碼。", type: "step", isOpen: false, children: [] },
                      { id: "p-step3", title: "③ 刷入 IBC", description: "刷入待驗 IBC 條碼。", type: "step", isOpen: false, children: [] },
                      { id: "p-step4", title: "④ 查詢屬性", description: "查詢是否為移轉貨物。", notes: "⚠️ 轉出貨優先！", type: "step", isOpen: false, children: [] },
                      { id: "p-step5", title: "⑤ 盤點", description: "盤點貨物數量與效期。", type: "step", isOpen: false, children: [] },
                      { id: "p-step6", title: "⑥ 輸入數量", description: "輸入實際驗收數量。", type: "step", isOpen: false, children: [] },
                      {
                        id: "p-step7", title: "⑦ 選擇物流箱分類", description: "選擇 RCRT 或 GCGP。", notes: "⚠️ 優先處理移轉貨。", type: "step", isOpen: true,
                        children: [
                          { id: "proc_gcgp", title: "若為 GCGP (轉出專用)", description: "輸入數量 -> 貼 GCGP 標籤 -> 換高角錐+紅白扁角錐。", notes: "【GCGP 規範】\n• 每棧板最多五種貨物。\n• 需相同轉出位置。", type: "step", isOpen: true, style: { bgColor: "bg-rose-50", borderColor: "border-rose-500", fontFamily: "font-sans" }, children: [] },
                          { id: "proc_rcrt", title: "若為 RCRT (廠內用)", description: "寫轉出位置與碼頭號 -> 貼標籤 -> 換高角錐 -> 入庫。", notes: "【RCRT 規範】\n• 一個標示對應一種貨物。", type: "step", isOpen: true, style: { bgColor: "bg-emerald-50", borderColor: "border-emerald-500", fontFamily: "font-sans" }, children: [] }
                        ]
                      },
                      { id: "p-step8", title: "⑧ 確認物流箱", description: "刷入對應條碼確認。", type: "step", isOpen: false, children: [] },
                      { id: "p-step9", title: "⑨ 完成驗收", description: "點選「入庫」。", type: "step", isOpen: false, children: [] }
                    ]
                  }
                ]
              }
            ]
          }
        }
      ];

      const generateId = () => `node-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
      const JUMP_TARGET_DELIMITER = '::';
      const normalizeJumpTargetId = (value, fallbackPageId) => {
        if (!value) return { pageId: fallbackPageId, nodeId: '', key: '' };
        if (value.includes(JUMP_TARGET_DELIMITER)) {
          const [pageId, nodeId] = value.split(JUMP_TARGET_DELIMITER);
          return { pageId, nodeId, key: `${pageId}${JUMP_TARGET_DELIMITER}${nodeId}` };
        }
        return { pageId: fallbackPageId, nodeId: value, key: `${fallbackPageId}${JUMP_TARGET_DELIMITER}${value}` };
      };

      const Icon = ({ label }) => (
        <span className="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-slate-500 rounded" title={label}>{label.slice(0,1)}</span>
      );

      const ToggleButton = ({ open }) => (
        <span className={`inline-flex items-center justify-center w-5 h-5 rounded ${open ? 'bg-slate-100' : 'bg-slate-200'}`}>{open ? '▾' : '▸'}</span>
      );

      const TreeNode = ({
        node,
        selectedId,
        onSelect,
        onToggle,
        onAction,
        depth = 0,
        isEditable,
        searchTerm,
        onImageClick,
        onCardClick,
        siblingIndex = 0,
        siblingCount = 1,
        parentId = null,
        rootId,
        nodeIndex = [],
        onSelectJumpTarget,
        onJumpToNode,
        activePageId,
        numberPath = [],
        pages = [],
        onCopyNode,
        onDuplicatePage
      }) => {
        const [showLinkPicker, setShowLinkPicker] = useState(false);
        const [showCopyPicker, setShowCopyPicker] = useState(false);
        const pickerWrapperRef = useRef(null);
        const copyWrapperRef = useRef(null);
        const isSelected = selectedId === node.id;
        const nodeStyle = { bgColor: 'bg-white', borderColor: 'border-slate-200', fontFamily: 'font-sans', titleSize: 'text-lg', contentSize: 'text-base', ...node.style };
        const images = node.images || [];
        const links = node.links || [];
        const jumpTargetIds = Array.isArray(node.jumpTargetIds)
          ? node.jumpTargetIds
          : node.jumpTargetId
            ? [node.jumpTargetId]
            : [];
        const jumpTargetKeys = jumpTargetIds
          .map(id => normalizeJumpTargetId(id, activePageId).key)
          .filter(Boolean);
        const jumpTargets = jumpTargetKeys
          .map(key => nodeIndex.find(item => item.key === key))
          .filter(Boolean);
        const hasJumpTarget = jumpTargets.length > 0;
        const selfKey = normalizeJumpTargetId(node.id, activePageId).key;
        const selectableTargets = nodeIndex.filter(item => item.key !== selfKey);
        const canMoveUp = isEditable && parentId && siblingIndex > 0;
        const canMoveDown = isEditable && parentId && siblingIndex < siblingCount - 1;
        const canLevelUp = isEditable && parentId && parentId !== rootId;
        const canLevelDown = isEditable && parentId && siblingIndex > 0;
        const hasSearchTerm = (searchTerm || '').trim().length > 0;
        const lowerTerm = (searchTerm || '').toLowerCase();
        const hasMatch = hasSearchTerm && (
          (node.title || '').toLowerCase().includes(lowerTerm) ||
          (node.description || '').toLowerCase().includes(lowerTerm) ||
          (node.notes || '').toLowerCase().includes(lowerTerm)
        );
        const jumpPaddingStyle = hasJumpTarget ? { paddingRight: '4rem', paddingBottom: `${16 + jumpTargets.length * 28}px` } : {};
        const isContentOpen = node.isContentOpen !== false;

        useEffect(() => {
          if (!showLinkPicker) return;
          const handleClickOutside = (e) => {
            if (pickerWrapperRef.current && !pickerWrapperRef.current.contains(e.target)) {
              setShowLinkPicker(false);
            }
          };
          document.addEventListener('mousedown', handleClickOutside);
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, [showLinkPicker]);

        useEffect(() => {
          if (!showCopyPicker) return;
          const handleClickOutside = (e) => {
            if (copyWrapperRef.current && !copyWrapperRef.current.contains(e.target)) {
              setShowCopyPicker(false);
            }
          };
          document.addEventListener('mousedown', handleClickOutside);
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, [showCopyPicker]);

        const getIconLabel = () => {
          if (node.type === 'role') return 'R';
          if (node.type === 'process') return 'P';
          return 'S';
        };

        return (
          <div className="relative flex flex-col select-none">
            {depth > 0 && <div className="absolute top-0 left-[-24px] h-full w-px bg-slate-300 transform -translate-x-1/2" />}
            {depth > 0 && <div className="absolute top-[28px] left-[-24px] w-6 h-px bg-slate-300" />}
            <div className="mb-4 relative group">
              <div
                id={`node-${node.id}`}
                onClick={(e) => { e.stopPropagation(); onCardClick(node.id); }}
                style={jumpPaddingStyle}
                className={`relative rounded-xl border p-4 transition-all duration-200 cursor-pointer ${nodeStyle.bgColor} ${nodeStyle.fontFamily} ${isSelected ? 'ring-2 ring-blue-500 ring-offset-2 shadow-lg scale-[1.01]' : 'shadow-sm hover:shadow-md hover:border-blue-300'} ${nodeStyle.borderColor.includes('border-l-4') ? nodeStyle.borderColor : `border-l-4 ${nodeStyle.borderColor}`} ${hasMatch ? 'border-dashed border-amber-400 shadow-[0_0_0_3px_rgba(251,191,36,0.25)]' : ''}`}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-start gap-3 flex-1">
                    {isEditable && parentId && (
                      <div className="flex flex-col items-center gap-1 pt-1 text-slate-400">
                        <button onClick={(e) => { e.stopPropagation(); onAction('moveUp', node.id); }} disabled={!canMoveUp} className={`p-1 rounded hover:bg-slate-100 ${canMoveUp ? 'hover:text-blue-600' : 'opacity-40 cursor-not-allowed'}`} title="上移">↑</button>
                        <button onClick={(e) => { e.stopPropagation(); onAction('moveDown', node.id); }} disabled={!canMoveDown} className={`p-1 rounded hover:bg-slate-100 ${canMoveDown ? 'hover:text-blue-600' : 'opacity-40 cursor-not-allowed'}`} title="下移">↓</button>
                      </div>
                    )}
                    <div className={`p-2 rounded-lg shrink-0 ${isSelected ? 'bg-blue-50' : 'bg-white/80 border border-slate-100'}`}><Icon label={getIconLabel()} /></div>
                    <div className="flex-1">
                      <h3 className={`font-bold text-slate-800 leading-tight ${nodeStyle.titleSize}`}>
                        {depth > 0 && (
                          <span className="mr-2 text-slate-400 font-semibold">{numberPath.join('.')}.</span>
                        )}
                        {node.title}
                      </h3>
                    </div>
                  </div>
                  <div className={`flex items-center gap-1 transition-opacity duration-200 ${isSelected || 'group-hover:opacity-100 opacity-0'}`}>
                    {isEditable && (
                      <>
                        <button onClick={(e) => { e.stopPropagation(); onAction('addSibling', node.id); }} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded" title="新增同層">＋同層</button>
                        <button onClick={(e) => { e.stopPropagation(); onAction('addChild', node.id); }} className="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded" title="新增子層">＋子</button>
                        <button onClick={(e) => { e.stopPropagation(); onAction('levelUp', node.id); }} className={`p-1.5 rounded text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 ${!canLevelUp ? 'opacity-40 cursor-not-allowed' : ''}`} disabled={!canLevelUp} title="提升層級">↰</button>
                        <button onClick={(e) => { e.stopPropagation(); onAction('levelDown', node.id); }} className={`p-1.5 rounded text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 ${!canLevelDown ? 'opacity-40 cursor-not-allowed' : ''}`} disabled={!canLevelDown} title="降低層級">↳</button>
                        <div className="relative" ref={pickerWrapperRef}>
                         <button
                            onClick={(e) => { e.stopPropagation(); setShowLinkPicker(true); }}
                            className="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded"
                            title="設定指向區塊"
                          >
                            🔗
                          </button>
                          {showLinkPicker && (
                            <div className="absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-lg shadow-xl z-50">
                              <div className="flex items-center justify-between px-3 py-2 border-b border-slate-100 text-xs text-slate-500">
                                <span>指向其他區塊</span>
                                <div className="flex items-center gap-1">
                                  {jumpTargets.length > 0 && (
                                    <button
                                      onClick={(e) => { e.stopPropagation(); onSelectJumpTarget?.(node.id, null, 'clearAll'); }}
                                      className="text-amber-600 hover:text-amber-700"
                                    >
                                      清除
                                    </button>
                                  )}
                                  <button onClick={(e) => { e.stopPropagation(); setShowLinkPicker(false); }} className="text-slate-400 hover:text-slate-600">✕</button>
                                </div>
                              </div>
                              {jumpTargets.length > 0 && (
                                <div className="mt-2 mx-2 flex flex-wrap gap-2">
                                  {jumpTargets.map(target => (
                                    <div key={target.key} className="flex items-center gap-1 rounded-md bg-indigo-50 px-2 py-1 text-[11px] text-indigo-800">
                                      <button
                                        onClick={(e) => { e.stopPropagation(); onSelectJumpTarget?.(node.id, target.key, 'removeOne'); }}
                                        className="text-indigo-500 hover:text-indigo-700"
                                        title="取消指向"
                                      >
                                        ✕
                                      </button>
                                      <span className="font-semibold truncate max-w-[8rem]">{target.title}</span>
                                    </div>
                                  ))}
                                </div>
                              )}
                                <div className="max-h-64 overflow-y-auto p-2 space-y-1">
                                  {selectableTargets.length === 0 && <div className="text-xs text-slate-400 px-2 py-1">目前沒有其他區塊</div>}
                                  {selectableTargets.map(opt => {
                                  const isPicked = jumpTargetKeys.includes(opt.key);
                                  return (
                                    <button
                                      key={opt.key}
                                      onClick={(e) => { e.stopPropagation(); onSelectJumpTarget?.(node.id, opt.key, 'toggle'); }}
                                      className={`w-full text-left p-2 rounded-md border ${isPicked ? 'bg-indigo-50 border-indigo-200' : 'border-transparent hover:bg-slate-100 hover:border-blue-200'}`}
                                    >
                                      <div className="flex items-center justify-between gap-2">
                                        <div>
                                          <div className="text-sm font-semibold text-slate-800 truncate">{opt.title}</div>
                                          <div className="text-[11px] text-slate-500 truncate">{opt.path}</div>
                                        </div>
                                        {isPicked && <span className="text-indigo-500 text-xs font-bold">✓</span>}
                                      </div>
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                        </div>
                        <div className="relative" ref={copyWrapperRef}>
                          <button
                            onClick={(e) => { e.stopPropagation(); setShowCopyPicker(true); }}
                            className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded"
                            title="複製區塊"
                          >
                            📄
                          </button>
                          {showCopyPicker && (
                            <div className="absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-lg shadow-xl z-50">
                              <div className="flex items-center justify-between px-3 py-2 border-b border-slate-100 text-xs text-slate-500">
                                <span>複製到頁面</span>
                                <button onClick={(e) => { e.stopPropagation(); setShowCopyPicker(false); }} className="text-slate-400 hover:text-slate-600">✕</button>
                              </div>
                              <div className="max-h-64 overflow-y-auto p-2 space-y-1">
                                {pages.map(page => (
                                  <button
                                    key={page.id}
                                    onClick={(e) => { e.stopPropagation(); onCopyNode?.(node.id, page.id); setShowCopyPicker(false); }}
                                    className="w-full text-left p-2 rounded-md border border-transparent hover:bg-slate-100 hover:border-blue-200"
                                  >
                                    <div className="text-sm font-semibold text-slate-800 truncate">{page.name}</div>
                                  </button>
                                ))}
                              </div>
                              <div className="border-t border-slate-100 px-2 py-2">
                                <button
                                  onClick={(e) => { e.stopPropagation(); onDuplicatePage?.(null, { createOnly: true, sourceNodeId: node.id }); setShowCopyPicker(false); }}
                                  className="w-full text-xs text-blue-600 hover:text-blue-700 flex items-center justify-center gap-1"
                                >
                                  ＋ 新增頁面並複製
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                        {depth > 0 && <button onClick={(e) => { e.stopPropagation(); onAction('delete', node.id); }} className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded" title="刪除">刪</button>}
                      </>
                    )}
                    {node.children && node.children.length > 0 && (
                      <button onClick={(e) => { e.stopPropagation(); onToggle(node.id); }} className={`p-1 rounded hover:bg-slate-100 text-slate-500 ${!node.isOpen && 'bg-slate-100 text-slate-800'}`}><ToggleButton open={node.isOpen} /></button>
                    )}
                  </div>
                </div>
                {isContentOpen && (
                  <div className="mt-3 pl-[3.25rem] animate-fadeIn">
                    {node.description && <p className={`text-slate-600 whitespace-pre-line leading-relaxed mb-2 ${nodeStyle.contentSize}`}>{node.description}</p>}
                    {node.notes && <div className="flex items-start gap-2 p-2.5 bg-amber-50 border border-amber-100 rounded-md text-amber-900 text-sm mb-2"><span className="font-bold">!</span><p className="whitespace-pre-line">{node.notes}</p></div>}
                    {images.length > 0 && (
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mt-2">
                        {images.map((img, idx) => (
                          <button
                            type="button"
                            key={idx}
                            onClick={(e) => { e.stopPropagation(); onImageClick(img); }}
                            className="relative group rounded-lg border border-slate-200 overflow-hidden bg-white shadow-sm"
                          >
                            <img src={img} className="w-full h-24 object-cover" />
                            <span className="absolute bottom-1 right-1 bg-slate-900/70 text-white text-[10px] px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100">放大</span>
                          </button>
                        ))}
                      </div>
                    )}
                    {links.length > 0 && <div className="flex flex-wrap gap-2 mt-2">{links.map((link, idx) => (<a key={idx} href={link.url} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()} className="inline-flex items-center gap-1.5 text-xs text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 border border-blue-100 px-2 py-1 rounded transition-colors">{link.title}</a>))}</div>}
                  </div>
                )}
                {hasJumpTarget && (
                  <div className="absolute bottom-3 right-3 flex flex-col items-end gap-2">
                    {jumpTargets.map(target => (
                      <button
                        key={target.key}
                        onClick={(e) => { e.stopPropagation(); onJumpToNode?.(target.key); }}
                        className="inline-flex items-center gap-1 text-xs text-blue-700 bg-blue-50 border border-blue-100 px-2 py-1 rounded-full shadow-sm hover:bg-blue-100"
                      >
                        跳轉至 {target.pageId && target.pageId !== activePageId ? `${target.pageName} / ${target.title}` : target.title}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
            {node.isOpen && node.children && <div className="pl-12">{node.children.map((child, idx) => (
              <TreeNode
                key={child.id}
                node={child}
                selectedId={selectedId}
                onSelect={onSelect}
                onToggle={onToggle}
                onAction={onAction}
                depth={depth + 1}
                isEditable={isEditable}
                searchTerm={searchTerm}
                onImageClick={onImageClick}
                onCardClick={onCardClick}
                siblingIndex={idx}
                siblingCount={node.children.length}
                parentId={node.id}
                rootId={rootId}
                nodeIndex={nodeIndex}
                onSelectJumpTarget={onSelectJumpTarget}
                onJumpToNode={onJumpToNode}
                activePageId={activePageId}
                numberPath={[...numberPath, idx + 1]}
              />
            ))}</div>}
          </div>
        );
      };

      const InspectorPanel = ({ selectedNode, onUpdate, onClose, isEditable }) => {
        if (!selectedNode) return null;

        const safeStyle = selectedNode.style || {};
        const images = selectedNode.images || [];
        const links = selectedNode.links || [];
        const [newImgUrl, setNewImgUrl] = useState('');
        const [newLink, setNewLink] = useState({ title: '', url: '' });

        const handleStyleChange = (key, value) => onUpdate(selectedNode.id, { ...selectedNode, style: { ...safeStyle, [key]: value } });

        const addImage = () => { if(newImgUrl) { onUpdate(selectedNode.id, { ...selectedNode, images: [...images, newImgUrl] }); setNewImgUrl(''); }};
        const removeImage = (idx) => { const n = [...images]; n.splice(idx, 1); onUpdate(selectedNode.id, { ...selectedNode, images: n }); };

        const addLink = () => { if(newLink.url) { onUpdate(selectedNode.id, { ...selectedNode, links: [...links, { title: newLink.title || newLink.url, url: newLink.url }] }); setNewLink({ title: '', url: '' }); }};
        const removeLink = (idx) => { const n = [...links]; n.splice(idx, 1); onUpdate(selectedNode.id, { ...selectedNode, links: n }); };

        return (
          <div className="h-full flex flex-col bg-white border-l border-slate-200 shadow-xl z-20 w-80 lg:w-96 transition-all duration-300">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
              <h2 className="font-bold text-slate-700 flex items-center gap-2">屬性面板</h2>
              <button onClick={onClose} className="p-1 hover:bg-slate-200 rounded text-slate-400">關閉</button>
            </div>
            <div className="flex-1 overflow-y-auto p-5 space-y-6">
              <div className="space-y-3">
                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">標題</label>
                <input type="text" disabled={!isEditable} value={selectedNode.title || ''} onChange={(e) => onUpdate(selectedNode.id, { ...selectedNode, title: e.target.value })} className="w-full p-2 border border-slate-200 rounded-md focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700 disabled:bg-slate-50" />
              </div>
              <div className="space-y-3">
                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">說明內容</label>
                <textarea rows={4} disabled={!isEditable} value={selectedNode.description || ''} onChange={(e) => onUpdate(selectedNode.id, { ...selectedNode, description: e.target.value })} className="w-full p-2 border border-slate-200 rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-600 resize-none disabled:bg-slate-50" />
              </div>
              <div className="space-y-3">
                <label className="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-1">注意事項</label>
                <textarea rows={3} disabled={!isEditable} value={selectedNode.notes || ''} onChange={(e) => onUpdate(selectedNode.id, { ...selectedNode, notes: e.target.value })} className="w-full p-2 border border-amber-200 bg-amber-50 rounded-md focus:ring-2 focus:ring-amber-500 outline-none text-sm text-slate-600 resize-none" />
              </div>
              <div className="space-y-3 pt-4 border-t border-slate-100">
                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">圖片庫</label>
                <div className="space-y-2">
                  {images.map((img, idx) => (
                    <div key={idx} className="relative group rounded border border-slate-200 overflow-hidden">
                      <img src={img} className="w-full h-20 object-cover opacity-80" />
                      {isEditable && <button onClick={() => removeImage(idx)} className="absolute top-1 right-1 bg-red-500 text-white p-1 rounded opacity-0 group-hover:opacity-100">刪除</button>}
                    </div>
                  ))}
                </div>
                {isEditable && (
                  <div className="flex gap-2 mt-2">
                    <input type="text" placeholder="輸入圖片 URL..." value={newImgUrl} onChange={e => setNewImgUrl(e.target.value)} className="flex-1 text-xs p-2 border rounded bg-slate-50" />
                    <button onClick={addImage} className="bg-slate-200 hover:bg-slate-300 p-2 rounded text-slate-600">新增</button>
                  </div>
                )}
              </div>
              <div className="space-y-3 pt-4 border-t border-slate-100">
                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">相關連結</label>
                <div className="space-y-2">
                  {links.map((link, idx) => (
                    <div key={idx} className="flex items-center justify-between p-2 bg-slate-50 rounded border border-slate-200 text-sm">
                      <a href={link.url} target="_blank" className="flex items-center gap-2 text-blue-600 truncate hover:underline">{link.title}</a>
                      {isEditable && <button onClick={() => removeLink(idx)} className="text-slate-400 hover:text-red-500">移除</button>}
                    </div>
                  ))}
                </div>
                {isEditable && (
                  <div className="flex flex-col gap-2 mt-2">
                    <input type="text" placeholder="連結名稱" value={newLink.title} onChange={e => setNewLink({...newLink, title: e.target.value})} className="text-xs p-2 border rounded bg-slate-50" />
                    <div className="flex gap-2">
                      <input type="text" placeholder="https://..." value={newLink.url} onChange={e => setNewLink({...newLink, url: e.target.value})} className="flex-1 text-xs p-2 border rounded bg-slate-50" />
                      <button onClick={addLink} className="bg-slate-200 hover:bg-slate-300 p-2 rounded text-slate-600">新增</button>
                    </div>
                  </div>
                )}
              </div>
              {isEditable && (
                <div className="space-y-4 pt-4 border-t border-slate-100">
                  <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">外觀設定</label>
                  <div className="grid grid-cols-2 gap-4">
                    <div><span className="text-[10px] text-slate-400 block mb-1">背景</span><div className="flex flex-wrap gap-1.5">{STYLE_OPTIONS.backgrounds.map(opt => (<button key={opt.value} onClick={() => handleStyleChange('bgColor', opt.value)} className={`w-5 h-5 rounded-full border ${opt.value} ${safeStyle.bgColor === opt.value ? 'ring-2 ring-blue-500' : 'border-slate-200'}`} title={opt.name} />))}</div></div>
                    <div><span className="text-[10px] text-slate-400 block mb-1">邊框</span><div className="flex flex-wrap gap-1.5">{STYLE_OPTIONS.borders.map(opt => (<button key={opt.value} onClick={() => handleStyleChange('borderColor', opt.value)} className={`w-5 h-5 rounded-full border-2 ${opt.value.replace('border', 'bg')} ${safeStyle.borderColor === opt.value ? 'ring-2 ring-blue-500' : 'border-transparent'}`} title={opt.name} />))}</div></div>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      function App() {
        const [pages, setPages] = useState(initialPages);
        const [activePageId, setActivePageId] = useState(initialPages[0].id);
        const [selectedId, setSelectedId] = useState(null);
        const [isEditable, setIsEditable] = useState(false);
        const [statusMsg, setStatusMsg] = useState('預覽模式');
        const [globalPassword, setGlobalPassword] = useState('');
        const [searchTerm, setSearchTerm] = useState('');
        const [searchResults, setSearchResults] = useState([]);
        const [imagePreview, setImagePreview] = useState('');
        const [showSearchPanel, setShowSearchPanel] = useState(true);
        const [tabOverflow, setTabOverflow] = useState({ canScrollLeft: false, canScrollRight: false });
        const [toastMessage, setToastMessage] = useState('');
        const [nodeIndex, setNodeIndex] = useState([]);
        const fileInputRef = useRef(null);
        const tabBarRef = useRef(null);
        const tabDragState = useRef({ isDown: false, startX: 0, scrollLeft: 0, moved: false });

        const showToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(''), 1800);
        };

        useEffect(() => {
          try {
            const raw = localStorage.getItem(LOCAL_SAVE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed.pages) setPages(parsed.pages);
              if (parsed.activePageId) setActivePageId(parsed.activePageId);
              if (parsed.globalPassword) setGlobalPassword(parsed.globalPassword);
              setStatusMsg('已載入本機草稿');
            }
          } catch (err) {
            console.error('Load draft failed', err);
          }
        }, []);

        useEffect(() => {
          const handleMouseMove = (e) => {
            if (!tabDragState.current.isDown) return;
            e.preventDefault();
            const el = tabBarRef.current;
            if (!el) return;
            const x = e.pageX - el.offsetLeft;
            const walk = x - tabDragState.current.startX;
            if (Math.abs(walk) > 2) tabDragState.current.moved = true;
            el.scrollLeft = tabDragState.current.scrollLeft - walk;
          };

          const handleMouseUp = () => {
            if (!tabDragState.current.isDown) return;
            tabDragState.current.isDown = false;
            tabBarRef.current?.classList.remove('cursor-grabbing');
            setTimeout(() => { tabDragState.current.moved = false; }, 0);
          };

          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
          return () => {
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('mouseup', handleMouseUp);
          };
        }, []);

        useEffect(() => {
          if (!searchTerm.trim() || !activeTreeData) return;
          const lower = searchTerm.toLowerCase();
          const expandMatches = (node) => {
            const childResults = (node.children || []).map(expandMatches);
            const childMatch = childResults.some(r => r.match);
            const selfMatch = (node.title || '').toLowerCase().includes(lower)
              || (node.description || '').toLowerCase().includes(lower)
              || (node.notes || '').toLowerCase().includes(lower);
            return {
              node: { ...node, isOpen: selfMatch || childMatch || node.isOpen, children: childResults.map(r => r.node) },
              match: selfMatch || childMatch
            };
          };

          const { node } = expandMatches(activeTreeData);
          updatePagesWithNewTree(node);
        }, [searchTerm]);

        useEffect(() => {
          if (!searchTerm.trim() || !activeTreeData) {
            setSearchResults([]);
            return;
          }
          const lower = searchTerm.toLowerCase();
          const results = [];
          const walk = (node, path) => {
            const fullPath = [...path, node.title || '未命名'];
            const match = (node.title || '').toLowerCase().includes(lower)
              || (node.description || '').toLowerCase().includes(lower)
              || (node.notes || '').toLowerCase().includes(lower);
            if (match) {
              results.push({
                id: node.id,
                key: `${activePageId}${JUMP_TARGET_DELIMITER}${node.id}`,
                title: node.title || '未命名',
                path: fullPath.join(' / ')
              });
            }
            (node.children || []).forEach(child => walk(child, fullPath));
          };
          walk(activeTreeData, []);
          setSearchResults(results);
        }, [searchTerm, activeTreeData, activePageId]);

        useEffect(() => {
          if (!pages.length) return;
          const list = [];
          const walk = (node, page, path = []) => {
            const title = node.title || '未命名';
            const currentPath = [...path, title];
          list.push({
            key: `${page.id}${JUMP_TARGET_DELIMITER}${node.id}`,
            id: node.id,
            pageId: page.id,
            pageName: page.name,
            title,
            path: `${page.name} / ${currentPath.join(' / ')}`
          });
            (node.children || []).forEach(child => walk(child, page, currentPath));
          };
          pages.forEach(page => {
            if (page.root) walk(page.root, page, []);
          });
          setNodeIndex(list);
        }, [pages]);

        const activePageIndex = pages.findIndex(p => p.id === activePageId);
        const activeTreeData = pages[activePageIndex]?.root;

        const findNode = (node, id) => {
          if (node.id === id) return node;
          if (node.children) {
            for (let child of node.children) {
              const found = findNode(child, id);
              if (found) return found;
            }
          }
          return null;
        };

        const findParent = (node, targetId, parent = null) => {
          if (node.id === targetId) return parent;
          for (const child of node.children || []) {
            const res = findParent(child, targetId, node);
            if (res) return res;
          }
          return null;
        };

        const updateNodeRec = (node, id, newData) => {
          if (node.id === id) return { ...newData, children: node.children };
          if (node.children) return { ...node, children: node.children.map(c => updateNodeRec(c, id, newData)) };
          return node;
        };
        const updatePagesWithNewTree = (newRoot) => {
          const newPages = [...pages];
          newPages[activePageIndex].root = newRoot;
          setPages(newPages);
        };
        const handleUpdateNode = (id, newData) => updatePagesWithNewTree(updateNodeRec(activeTreeData, id, newData));
        const collapseDescendants = (node) => ({
          ...node,
          isOpen: false,
          isContentOpen: false,
          children: (node.children || []).map(child => collapseDescendants(child))
        });
        const handleToggleNode = (id) => {
          const node = findNode(activeTreeData, id);
          if (!node) return;
          if (node.isOpen) {
            handleUpdateNode(id, collapseDescendants(node));
          } else {
            handleUpdateNode(id, { ...node, isOpen: true });
          }
        };
        const deleteNodeRec = (node, targetId) => {
          if (node.id === targetId) return null;
          if (!node.children) return node;
          const newChildren = node.children.map(c => deleteNodeRec(c, targetId)).filter(c => c !== null);
          return { ...node, children: newChildren };
        };
        const addSiblingRec = (node, targetId) => {
          if (node.children) {
            const idx = node.children.findIndex(c => c.id === targetId);
            if (idx !== -1) {
              const newNode = { id: generateId(), title: '新區塊', description: '', type: 'step', isOpen: true, images: [], links: [], style: { bgColor: 'bg-white', borderColor: 'border-slate-200', fontFamily: 'font-sans', titleSize: 'text-lg', contentSize: 'text-base' }, children: [] };
              const newArr = [...node.children]; newArr.splice(idx + 1, 0, newNode); return { ...node, children: newArr };
            }
            return { ...node, children: node.children.map(c => addSiblingRec(c, targetId)) };
          }
          return node;
        };
        const addChildRec = (node, parentId) => {
          if (node.id === parentId) {
            const newNode = { id: generateId(), title: '新子區塊', description: '', type: 'step', isOpen: true, images: [], links: [], style: { bgColor: 'bg-white', borderColor: 'border-slate-200', fontFamily: 'font-sans' }, children: [] };
            return { ...node, isOpen: true, children: [...(node.children || []), newNode] };
          }
          if (node.children) return { ...node, children: node.children.map(c => addChildRec(c, parentId)) };
          return node;
        };
        const removeNodeFromTree = (node, targetId) => {
          if (node.id === targetId) return { removed: node, tree: null };
          if (!node.children) return { removed: null, tree: node };
          let removed = null;
          const newChildren = [];
          for (const child of node.children) {
            const res = removeNodeFromTree(child, targetId);
            if (res.removed) removed = res.removed;
            if (res.tree) newChildren.push(res.tree);
          }
          return { removed, tree: { ...node, children: newChildren } };
        };

        const insertAsChild = (node, targetId, payload) => {
          if (node.id === targetId) return { ...node, isOpen: true, children: [...(node.children || []), payload] };
          if (node.children) return { ...node, children: node.children.map(c => insertAsChild(c, targetId, payload)) };
          return node;
        };

        const insertAsSibling = (node, targetId, payload, position) => {
          if (!node.children) return node;
          const idx = node.children.findIndex(c => c.id === targetId);
          if (idx !== -1) {
            const arr = [...node.children];
            arr.splice(position === 'before' ? idx : idx + 1, 0, payload);
            return { ...node, children: arr };
          }
          return { ...node, children: node.children.map(c => insertAsSibling(c, targetId, payload, position)) };
        };
        const reorderSiblings = (node, parentId, targetId, neighborId, position) => {
          if (node.id === parentId && node.children) {
            const arr = [...node.children];
            const currentIdx = arr.findIndex(c => c.id === targetId);
            const neighborIdx = arr.findIndex(c => c.id === neighborId);
            if (currentIdx === -1 || neighborIdx === -1) return node;
            const [item] = arr.splice(currentIdx, 1);
            const insertIdx = position === 'before'
              ? neighborIdx > currentIdx ? neighborIdx - 1 : neighborIdx
              : neighborIdx >= arr.length ? arr.length : neighborIdx + (currentIdx < neighborIdx ? 0 : 1);
            arr.splice(insertIdx, 0, item);
            return { ...node, children: arr };
          }
          if (node.children) return { ...node, children: node.children.map(c => reorderSiblings(c, parentId, targetId, neighborId, position)) };
          return node;
        };

        const moveNodeWithinLevel = (nodeId, direction) => {
          const parent = findParent(activeTreeData, nodeId);
          if (!parent || !parent.children) return;
          const siblings = parent.children;
          const idx = siblings.findIndex(c => c.id === nodeId);
          const neighbor = direction === 'up' ? siblings[idx - 1] : siblings[idx + 1];
          if (!neighbor) return;
          const updated = reorderSiblings(activeTreeData, parent.id, nodeId, neighbor.id, direction === 'up' ? 'before' : 'after');
          updatePagesWithNewTree(updated);
          setSelectedId(nodeId);
          setStatusMsg('已調整順序');
        };

        const levelUpNode = (nodeId) => {
          const parent = findParent(activeTreeData, nodeId);
          if (!parent || parent.id === activeTreeData.id) { setStatusMsg('已在最上層'); return; }
          const grand = findParent(activeTreeData, parent.id);
          if (!grand) return;
          const { removed, tree } = removeNodeFromTree(activeTreeData, nodeId);
          if (!removed || !tree) return;
          const updated = insertAsSibling(tree, parent.id, removed, 'after');
          updatePagesWithNewTree(updated);
          setSelectedId(nodeId);
          setStatusMsg('已提升層級');
        };

        const levelDownNode = (nodeId) => {
          const parent = findParent(activeTreeData, nodeId);
          if (!parent || !parent.children) { setStatusMsg('無法降低層級'); return; }
          const idx = parent.children.findIndex(c => c.id === nodeId);
          if (idx <= 0) { setStatusMsg('需要有上一個同層區塊才能降低'); return; }
          const newParent = parent.children[idx - 1];
          const { removed, tree } = removeNodeFromTree(activeTreeData, nodeId);
          if (!removed || !tree) return;
          const updated = insertAsChild(tree, newParent.id, removed);
          updatePagesWithNewTree(updated);
          setSelectedId(nodeId);
          setStatusMsg('已降低層級');
        };

        const handleNodeAction = (action, id) => {
          if (action === 'delete') {
            if (id === activeTreeData.id) return alert('根節點無法刪除');
            if (confirm('確定要刪除？')) {
              const res = deleteNodeRec(activeTreeData, id);
              updatePagesWithNewTree(res ? { ...res } : activeTreeData);
              if (selectedId === id) setSelectedId(null);
            }
          } else if (action === 'addSibling') {
            if (id === activeTreeData.id) return alert('根節點無法新增同層');
            updatePagesWithNewTree(addSiblingRec(activeTreeData, id));
          } else if (action === 'addChild') {
            updatePagesWithNewTree(addChildRec(activeTreeData, id));
            const parent = findNode(activeTreeData, id);
            if(parent && !parent.isOpen) handleUpdateNode(id, { ...parent, isOpen: true });
          } else if (action === 'moveUp') {
            moveNodeWithinLevel(id, 'up');
          } else if (action === 'moveDown') {
            moveNodeWithinLevel(id, 'down');
          } else if (action === 'levelUp') {
            levelUpNode(id);
          } else if (action === 'levelDown') {
            levelDownNode(id);
          }
        };

        const cloneNodeWithNewIds = (node) => ({
          ...node,
          id: generateId(),
          children: (node.children || []).map(child => cloneNodeWithNewIds(child))
        });

        const duplicatePage = (pageId, options = {}) => {
          const sourcePage = pageId ? pages.find(page => page.id === pageId) : null;
          const name = sourcePage ? `${sourcePage.name} (複製)` : prompt("新頁面名稱:");
          if (!name) return;
          const rootNode = sourcePage
            ? cloneNodeWithNewIds(sourcePage.root)
            : { id: generateId(), title: `${name} 總覽`, description: "開始...", notes: "", type: "role", isOpen: true, images: [], links: [], style: { bgColor: "bg-white", borderColor: "border-blue-500", fontFamily: "font-sans", titleSize: "text-2xl", contentSize: "text-base" }, children: [] };
          const newPage = { id: generateId(), name, root: rootNode };
          if (options.sourceNodeId) {
            const sourceNode = findNode(activeTreeData, options.sourceNodeId);
            if (sourceNode) {
              const copied = cloneNodeWithNewIds(sourceNode);
              newPage.root = { ...newPage.root, isOpen: true, children: [...(newPage.root.children || []), copied] };
            }
          }
          setPages([...pages, newPage]);
          setActivePageId(newPage.id);
        };

        const copyNodeToPage = (nodeId, pageId) => {
          const sourceNode = findNode(activeTreeData, nodeId);
          const targetPage = pages.find(page => page.id === pageId);
          if (!sourceNode || !targetPage) return;
          const clonedNode = cloneNodeWithNewIds(sourceNode);
          const updatedRoot = { ...targetPage.root, isOpen: true, children: [...(targetPage.root.children || []), clonedNode] };
          const updatedPages = pages.map(page => (
            page.id === pageId ? { ...page, root: updatedRoot } : page
          ));
          setPages(updatedPages);
          setStatusMsg('已複製區塊');
        };

        const addNewPage = () => {
          const name = prompt("新頁面名稱:");
          if(!name) return;
          const newPage = { id: generateId(), name: name, root: { id: generateId(), title: `${name} 總覽`, description: "開始...", notes: "", type: "role", isOpen: true, images: [], links: [], style: { bgColor: "bg-white", borderColor: "border-blue-500", fontFamily: "font-sans", titleSize: "text-2xl", contentSize: "text-base" }, children: [] } };
          setPages([...pages, newPage]); setActivePageId(newPage.id);
        };
        const editPageName = (pageId) => { const p = pages.find(page => page.id === pageId); const newName = prompt("修改名稱:", p.name); if(newName) { setPages(pages.map(page => page.id === pageId ? { ...page, name: newName } : page)); } };
        const deletePage = (pageId) => { if(pages.length <= 1) return alert("至少保留一個頁面"); if(confirm("確定刪除？")) { const newPages = pages.filter(p => p.id !== pageId); setPages(newPages); setActivePageId(newPages[0].id); } };

        const handleExport = () => { const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ pages, globalPassword })); const a = document.createElement('a'); a.href = str; a.download = `SOP_${new Date().toISOString().slice(0,10)}.json`; a.click(); };
        const handleImport = (e) => {
          const f = e.target.files[0]; if(!f) return;
          const r = new FileReader(); r.onload = ev => { try { const d = JSON.parse(ev.target.result); if(d.pages) { setPages(d.pages); setGlobalPassword(d.globalPassword||''); } else { setPages([{ id: 'imp', name: '匯入', root: d }]); } setIsEditable(false); setStatusMsg('匯入成功'); } catch(x){ setStatusMsg('格式錯誤'); } }; r.readAsText(f);
        };

        const handleLocalSave = () => {
          if (!confirm('確認要儲存變更嗎？')) return;
          try {
            localStorage.setItem(LOCAL_SAVE_KEY, JSON.stringify({ pages, globalPassword, activePageId, savedAt: new Date().toISOString() }));
            setStatusMsg('已儲存至本機');
            showToast('已儲存完成');
          } catch (err) {
            console.error('Local save failed', err);
            setStatusMsg('本機儲存失敗');
          }
        };

        const openPathToNode = (node, targetId) => {
          if (!node) return { found: false, node };
          if (node.id === targetId) return { found: true, node: { ...node, isOpen: true } };
          let found = false;
          const children = (node.children || []).map(child => {
            const res = openPathToNode(child, targetId);
            if (res.found) found = true;
            return res.node;
          });
          return { found, node: { ...node, isOpen: found || node.isOpen, children } };
        };

        const handleCardClick = (nodeId) => {
          setSelectedId(nodeId);
          const node = findNode(activeTreeData, nodeId);
          if (!node) return;
          const nextContentOpen = node.isContentOpen === false;
          if (nextContentOpen) {
            handleUpdateNode(nodeId, { ...node, isContentOpen: true });
          } else {
            handleUpdateNode(nodeId, collapseDescendants(node));
          }
        };

        const handleJumpToNode = (targetKey) => {
          const { pageId, nodeId } = normalizeJumpTargetId(targetKey, activePageId);
          const targetPage = pages.find(page => page.id === pageId);
          if (!targetPage) return;
          const res = openPathToNode(targetPage.root, nodeId);
          if (!res.found) return;
          const updatedPages = pages.map(page => (
            page.id === pageId ? { ...page, root: res.node } : page
          ));
          setPages(updatedPages);
          setActivePageId(pageId);
          setSelectedId(nodeId);
          setTimeout(() => document.getElementById(`node-${nodeId}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
        };

        const handleSelectJumpTarget = (nodeId, targetId, action = 'toggle') => {
          if (normalizeJumpTargetId(targetId, activePageId).key === normalizeJumpTargetId(nodeId, activePageId).key) {
            setStatusMsg('無法指向自己');
            return;
          }
          const node = findNode(activeTreeData, nodeId);
          if (!node) return;
          const existing = Array.isArray(node.jumpTargetIds)
            ? [...node.jumpTargetIds]
            : node.jumpTargetId
              ? [node.jumpTargetId]
              : [];
          const existingKeys = existing.map(id => normalizeJumpTargetId(id, activePageId).key).filter(Boolean);
          let next = existingKeys;
          if (action === 'clearAll' || targetId === null) {
            next = [];
          } else if (action === 'removeOne') {
            next = existingKeys.filter(id => id !== targetId);
          } else {
            next = existingKeys.includes(targetId)
              ? existingKeys.filter(id => id !== targetId)
              : [...existingKeys, targetId];
          }
          handleUpdateNode(nodeId, { ...node, jumpTargetIds: next, jumpTargetId: undefined });
          setStatusMsg(next.length ? '已更新跳轉區塊' : '已清除跳轉');
          if (next.length) showToast('已更新跳轉入口');
        };

        const updateTabOverflow = () => {
          const el = tabBarRef.current;
          if (!el) return;
          const canScrollLeft = el.scrollLeft > 2;
          const canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 2;
          setTabOverflow({ canScrollLeft, canScrollRight });
        };

        useEffect(() => {
          const handleResize = () => updateTabOverflow();
          window.addEventListener('resize', handleResize);
          updateTabOverflow();
          return () => window.removeEventListener('resize', handleResize);
        }, [pages]);

        const handleTabMouseDown = (e) => {
          const el = tabBarRef.current;
          if (!el) return;
          tabDragState.current = { isDown: true, startX: e.pageX - el.offsetLeft, scrollLeft: el.scrollLeft, moved: false };
          el.classList.add('cursor-grabbing');
        };

        const handleTabClick = (pageId) => {
          if (tabDragState.current.moved) return;
          setActivePageId(pageId);
          setSelectedId(null);
        };

        const scrollTabs = (direction) => {
          const el = tabBarRef.current;
          if (!el) return;
          const delta = direction === 'left' ? -180 : 180;
          el.scrollTo({ left: Math.max(0, el.scrollLeft + delta), behavior: 'smooth' });
          setTimeout(updateTabOverflow, 220);
        };

        const selectedNode = selectedId ? findNode(activeTreeData, selectedId) : null;

        return (
          <div className="h-screen w-full flex flex-col bg-slate-50 overflow-hidden font-sans text-slate-800">
            <header className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0 z-30">
              <div className="flex items-end gap-6 relative">
                <div className="flex items-center gap-2 font-bold text-xl text-slate-800"><div className="bg-blue-600 rounded-md p-1.5 text-white">S</div><span>SOP Studio (Standalone)</span></div>
                <div className="relative w-[360px] sm:w-[480px] md:w-[560px] lg:w-[640px] max-w-[60vw]">
                  <div
                    ref={tabBarRef}
                    onMouseDown={handleTabMouseDown}
                    onScroll={updateTabOverflow}
                    className="flex items-center gap-2 overflow-x-auto no-scrollbar cursor-grab active:cursor-grabbing pr-8"
                  >
                    {pages.map(page => (
                      <div
                        key={page.id}
                        onClick={() => handleTabClick(page.id)}
                        className={`group relative flex items-center gap-2 px-3 py-1 rounded-lg text-sm font-medium cursor-pointer transition-all border whitespace-nowrap ${activePageId === page.id ? 'bg-slate-100 text-slate-800 border-slate-200 shadow-sm' : 'bg-transparent text-slate-500 border-transparent hover:bg-slate-50'}`}
                      >
                        {page.name}
                        {isEditable && activePageId === page.id && (
                          <div className="flex gap-1 ml-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={(e) => { e.stopPropagation(); editPageName(page.id); }} className="hover:text-blue-600">編</button>
                            <button onClick={(e) => { e.stopPropagation(); duplicatePage(page.id); }} className="hover:text-emerald-600">複</button>
                            <button onClick={(e) => { e.stopPropagation(); deletePage(page.id); }} className="hover:text-red-600">刪</button>
                          </div>
                        )}
                      </div>
                    ))}
                    {isEditable && <button onClick={addNewPage} className="p-1.5 rounded-md hover:bg-slate-100 text-slate-400 hover:text-blue-600 transition-colors">＋</button>}
                  </div>
                  {tabOverflow.canScrollLeft && (
                    <button
                      onClick={() => scrollTabs('left')}
                      className="absolute -bottom-3 left-0 bg-white border border-slate-200 shadow-sm rounded-full p-1 text-slate-500 hover:text-blue-600"
                      aria-label="向左捲動頁籤"
                    >
                      <span className="block transform -rotate-180">›</span>
                    </button>
                  )}
                  {tabOverflow.canScrollRight && (
                    <button
                      onClick={() => scrollTabs('right')}
                      className="absolute -bottom-3 right-0 bg-white border border-slate-200 shadow-sm rounded-full p-1 text-slate-500 hover:text-blue-600"
                      aria-label="向右捲動頁籤"
                    >
                      <span className="block">›</span>
                    </button>
                  )}
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="flex gap-1">
                  <button onClick={handleExport} className="p-2 hover:bg-slate-100 rounded text-slate-500">匯出</button>
                  <label className="p-2 hover:bg-slate-100 rounded text-slate-500 cursor-pointer">匯入<input type="file" ref={fileInputRef} onChange={handleImport} className="hidden" accept=".json"/></label>
                </div>
                <button onClick={handleLocalSave} className="flex items-center gap-1 bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow-sm transition-colors">儲存</button>
                <button onClick={() => { if(isEditable) { setIsEditable(false); setStatusMsg('已切換至預覽'); } else { if(globalPassword && prompt('輸入密碼')!==globalPassword) return alert('密碼錯誤'); setIsEditable(true); setStatusMsg('編輯模式'); } }} className={`p-2 rounded-lg text-slate-500 hover:bg-slate-100 ${isEditable && 'bg-blue-50 text-blue-600'}`}>{isEditable ? '解鎖' : '鎖定'}</button>
                {isEditable && <button onClick={() => { const p = prompt('設定新密碼:', globalPassword); if(p!==null) setGlobalPassword(p); }} className="p-2 rounded-lg text-slate-500 hover:bg-slate-100">密碼</button>}
                <button onClick={() => alert('此為離線預覽版本，分享功能僅在完整專案中可用。')} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-medium shadow-sm transition-colors">分享</button>
              </div>
            </header>
            <div className="h-6 bg-slate-50 border-b border-slate-200 flex items-center justify-center text-[10px] text-slate-400"><span>{statusMsg || (isEditable ? '編輯模式' : '預覽模式')}</span></div>
            <main className="flex-1 flex overflow-hidden relative">
              <aside className={`bg-white border-r border-slate-200 h-full flex flex-col transition-all duration-200 ${showSearchPanel ? `w-[${SEARCH_PANEL_WIDTH}px]` : 'w-9'} overflow-hidden`}>
                <div className="flex items-center justify-between px-2 py-2 border-b border-slate-100">
                  <button onClick={() => setShowSearchPanel(!showSearchPanel)} className="p-2 rounded-md hover:bg-slate-100 text-slate-500" title={showSearchPanel ? '收合搜尋' : '展開搜尋'}>
                    🔍
                  </button>
                  {showSearchPanel && <span className="text-xs text-slate-500 font-medium">搜尋</span>}
                </div>
                {showSearchPanel && (
                  <div className="flex-1 overflow-y-auto p-3 space-y-3">
                    <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 rounded-lg px-2 py-1.5 text-sm text-slate-600">
                      <input
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        placeholder="搜尋標題 / 內容 / 備註"
                        className="bg-transparent outline-none flex-1"
                      />
                      {searchTerm && <button onClick={() => setSearchTerm('')} className="text-slate-400 hover:text-slate-600 text-xs">清除</button>}
                    </div>
                    <div className="flex items-center justify-between text-[11px] text-slate-500 px-1">
                      <span>符合項目：{searchResults.length}</span>
                    </div>
                    <div className="space-y-1">
                      {searchResults.map(item => (
                        <button
                          key={item.key}
                          onClick={() => handleJumpToNode(item.key)}
                          className="w-full text-left px-2 py-2 rounded-lg border border-slate-200 bg-slate-50 hover:bg-blue-50 hover:border-blue-200 text-xs"
                        >
                          <div className="font-semibold text-slate-800 truncate">{item.title}</div>
                          <div className="text-[10px] text-slate-500 truncate">{item.path}</div>
                        </button>
                      ))}
                      {searchTerm && searchResults.length === 0 && <p className="text-xs text-amber-500 px-2">沒有找到結果</p>}
                    </div>
                  </div>
                )}
              </aside>
              <div className="flex-1 overflow-auto bg-slate-50/50 p-8 md:p-12" onClick={() => setSelectedId(null)}>
                <div className="max-w-4xl mx-auto pb-32">
                  {activeTreeData && (
                    <TreeNode
                      node={activeTreeData}
                      selectedId={selectedId}
                      onSelect={setSelectedId}
                      onToggle={handleToggleNode}
                      onAction={handleNodeAction}
                      isEditable={isEditable}
                      searchTerm={searchTerm}
                      onImageClick={setImagePreview}
                      onCardClick={handleCardClick}
                      rootId={activeTreeData.id}
                      nodeIndex={nodeIndex}
                      onSelectJumpTarget={handleSelectJumpTarget}
                      onJumpToNode={handleJumpToNode}
                      activePageId={activePageId}
                      pages={pages}
                      onCopyNode={copyNodeToPage}
                      onDuplicatePage={duplicatePage}
                    />
                  )}
                  <div className="pl-12 relative mt-4 opacity-50"><div className="absolute top-0 left-[-24px] h-8 w-px bg-slate-300 transform -translate-x-1/2" /><div className="ml-4 p-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-400 text-xs text-center">END OF FLOW</div></div>
                </div>
              </div>
              {selectedId && <InspectorPanel selectedNode={selectedNode} onUpdate={handleUpdateNode} onClose={() => setSelectedId(null)} isEditable={isEditable} />}
            </main>
            {toastMessage && (
              <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg animate-fadeIn">
                {toastMessage}
              </div>
            )}
            {imagePreview && (
              <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={() => setImagePreview('')}>
                <div className="relative bg-white rounded-xl shadow-2xl max-w-4xl w-full p-4" onClick={(e) => e.stopPropagation()}>
                  <button onClick={() => setImagePreview('')} className="absolute top-2 right-2 bg-white/80 hover:bg-white text-slate-600 border border-slate-200 rounded-full px-2 py-1 text-sm">關閉</button>
                  <img src={imagePreview} className="w-full max-h-[70vh] object-contain rounded-lg" />
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
