<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOP 離線樹狀編輯器 (純 HTML 版)</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --accent: #2563eb;
      --muted: #64748b;
      --danger: #dc2626;
      --border: #e2e8f0;
      --success: #16a34a;
      font-family: "Noto Sans TC", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #0f172a; }
    .app { max-width: 1100px; margin: 24px auto 48px; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(15,23,42,0.05); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; border: 1px solid var(--border); background: #fff; color: #0f172a; padding: 8px 12px; border-radius: 10px; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    button.danger { background: #fee2e2; border-color: #fecdd3; color: var(--danger); }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,0.15); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: #e0f2fe; border-radius: 999px; color: #075985; font-size: 13px; }
    .muted { color: var(--muted); font-size: 14px; }
    .tree { margin-top: 12px; }
    .node { position: relative; margin-bottom: 12px; }
    .children { margin-left: 26px; border-left: 1px dashed #cbd5e1; padding-left: 18px; }
    .title-row { display: flex; align-items: center; gap: 10px; }
    .title { font-size: 18px; font-weight: 700; margin: 0; }
    .pill { padding: 4px 8px; border-radius: 999px; font-size: 12px; background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }
    .note { background: #fef9c3; border: 1px solid #fef3c7; padding: 10px 12px; border-radius: 10px; color: #92400e; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .body { margin-top: 10px; color: #334155; white-space: pre-line; line-height: 1.6; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font-size: 13px; background: #ecfeff; color: #0f172a; border: 1px solid #bae6fd; }
    .panel { background: #fff; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 12px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .modal { width: min(600px, 100%); background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 20px 60px rgba(15,23,42,0.25); }
    label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; background: #f8fafc; }
    textarea { min-height: 90px; resize: vertical; }
    .footer { text-align: center; margin-top: 18px; color: var(--muted); font-size: 13px; }
    .small { font-size: 12px; color: var(--muted); }
    @media (max-width: 640px) { .toolbar { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="card" style="margin-bottom:14px; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:22px; font-weight:800; display:flex; gap:8px; align-items:center;">SOP 離線樹狀編輯器 <span class="pill">無需安裝 / 無帳戶</span></div>
        <div class="muted" style="margin-top:4px;">離線可用、資料自動保存在瀏覽器 LocalStorage，可匯入/匯出 JSON 備份。</div>
      </div>
      <div class="chip" id="storageStatus">尚未儲存</div>
    </div>

    <div class="toolbar">
      <button class="primary" id="btnAddRootChild">新增流程步驟</button>
      <button id="btnExport">匯出 JSON</button>
      <label style="display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; cursor:pointer;">匯入 JSON<input type="file" id="importFile" accept="application/json" style="display:none"></label>
      <button id="btnReset" class="danger">清除本機資料</button>
      <div class="badge" id="tipBadge">首次使用：直接展開下方樹狀流程並點「編輯」。</div>
    </div>

    <div class="panel small" style="margin-bottom:10px;">不需要 Node、NPM 或網路。將此 <code>index.html</code> 放到任何資料夾，直接用瀏覽器開啟即可。若要分享修改結果，請使用「匯出 JSON」。</div>

    <div class="tree" id="tree"></div>
    <div class="footer">資料儲存位置：瀏覽器 LocalStorage（key: <code>sop_tree_standalone_v2</code>）。</div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3 style="margin:0 0 12px 0; font-size:18px;">編輯區塊</h3>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label>標題</label>
          <input type="text" id="fldTitle" />
        </div>
        <div>
          <label>說明</label>
          <textarea id="fldDesc"></textarea>
        </div>
        <div>
          <label>注意事項</label>
          <textarea id="fldNote"></textarea>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label>圖片網址 (可空白)</label>
            <input type="text" id="fldImg" placeholder="https://..." />
          </div>
          <div>
            <label>相關連結 (可空白)</label>
            <input type="text" id="fldLink" placeholder="https://..." />
          </div>
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button class="ghost" id="btnCancel">取消</button>
        <button class="primary" id="btnSave">儲存</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'sop_tree_standalone_v2';
    const treeRoot = document.getElementById('tree');
    const storageStatus = document.getElementById('storageStatus');
    const tipBadge = document.getElementById('tipBadge');
    const modal = document.getElementById('modalBackdrop');
    const fldTitle = document.getElementById('fldTitle');
    const fldDesc = document.getElementById('fldDesc');
    const fldNote = document.getElementById('fldNote');
    const fldImg = document.getElementById('fldImg');
    const fldLink = document.getElementById('fldLink');
    const btnSave = document.getElementById('btnSave');
    const btnCancel = document.getElementById('btnCancel');

    const initialData = {
      id: 'root',
      title: '散驗人員 (Role)',
      description: '在輸送帶旁的工作台進行較小型商品驗收與入庫。\n可裝入物流箱的為散貨，無法裝入箱或太大者為板貨。',
      notes: '',
      type: 'role',
      isOpen: true,
      children: [
        {
          id: 'process',
          title: '散驗作業流程 (Process)',
          description: '點擊展開查看詳細的驗收步驟與規範。',
          notes: '',
          type: 'process',
          isOpen: true,
          children: [
            { id: 'step1', title: '步驟 1：啟動輸送帶', description: '按下綠色按鈕啟動輸送帶，讓貨到達工作台。', type: 'step', isOpen: false, children: [] },
            { id: 'step2', title: '步驟 2：開啟系統', description: '打開 worker tool，選擇「入庫」功能。', type: 'step', isOpen: false, children: [] },
            { id: 'step3', title: '步驟 3：刷讀條碼', description: '依序刷以下條碼：\n1. 工作台條碼\n2. IBC 條碼（麥頭上）\n3. 商品條碼', type: 'step', isOpen: false, children: [] },
            { id: 'step4', title: '步驟 4：商品檢核', description: '檢查外觀、品名、圖片、效期等是否與系統相符。', notes: '⚠️ 效期需大於系統顯示日期，若小於請報警示。', type: 'step', isOpen: false, children: [] },
            { id: 'step5', title: '步驟 5：裝箱', description: '驗收完成後，將商品放入物流箱內。', notes: '⚠️ 注意不要超過限高線，以免造成後續自動倉儲卡貨。', type: 'step', isOpen: false, children: [] },
            { id: 'step6', title: '步驟 6：輸入數量與儲位', description: '在系統輸入數量，選擇要送去的倉庫位置（一樓或二樓）。\n部分商品會自動分配儲位，其他需手動選取。', type: 'step', isOpen: false, children: [] },
            { id: 'step7', title: '步驟 7：確認入庫', description: '掃物流箱條碼，確認入庫完成。', type: 'step', isOpen: false, children: [] },
            { id: 'step8', title: '步驟 8：資料查驗', description: '開啟物流箱條碼查驗資料，若正確，點選「入庫」。', type: 'step', isOpen: false, children: [] },
            { id: 'step9', title: '步驟 9：完成作業', description: '將物流箱推入下方輸送帶，完成本次散驗。', type: 'step', isOpen: false, children: [] }
          ]
        }
      ]
    };

    const state = {
      tree: loadFromStorage() || initialData,
      editingId: null,
    };

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        storageStatus.textContent = '已自動復原本機資料';
        storageStatus.style.background = '#dcfce7';
        storageStatus.style.borderColor = '#bbf7d0';
        return parsed;
      } catch (e) {
        console.warn('restore failed', e);
        return null;
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tree));
      storageStatus.textContent = '已離線儲存';
      storageStatus.style.background = '#dbeafe';
      storageStatus.style.borderColor = '#bfdbfe';
    }

    function generateId() {
      return 'node-' + Math.random().toString(36).slice(2, 9);
    }

    function toggleOpen(id) {
      walk(state.tree, (node) => {
        if (node.id === id) node.isOpen = !node.isOpen;
      });
      render();
    }

    function walk(node, fn) {
      fn(node);
      (node.children || []).forEach(c => walk(c, fn));
    }

    function findWithParent(node, targetId, parent = null) {
      if (node.id === targetId) return { node, parent };
      for (const child of node.children || []) {
        const found = findWithParent(child, targetId, node);
        if (found) return found;
      }
      return null;
    }

    function addChild(parentId) {
      const found = findWithParent(state.tree, parentId);
      if (!found) return;
      found.node.isOpen = true;
      const newNode = { id: generateId(), title: '新子區塊', description: '請填寫說明...', type: 'step', isOpen: true, children: [] };
      found.node.children = found.node.children || [];
      found.node.children.push(newNode);
      persist();
      render();
    }

    function addSibling(targetId) {
      const found = findWithParent(state.tree, targetId);
      if (!found || !found.parent) { alert('根節點無法新增同級區塊'); return; }
      const siblings = found.parent.children || [];
      const idx = siblings.findIndex(c => c.id === targetId);
      siblings.splice(idx + 1, 0, { id: generateId(), title: '新同級區塊', description: '請填寫說明...', type: 'step', isOpen: true, children: [] });
      persist();
      render();
    }

    function deleteNode(targetId) {
      if (targetId === state.tree.id) { alert('根節點無法刪除'); return; }
      const found = findWithParent(state.tree, targetId);
      if (!found || !found.parent) return;
      if (!confirm('確定刪除此區塊？該區塊下的子項目會一起移除。')) return;
      found.parent.children = (found.parent.children || []).filter(c => c.id !== targetId);
      persist();
      render();
    }

    function openEditor(id) {
      const found = findWithParent(state.tree, id);
      if (!found) return;
      state.editingId = id;
      fldTitle.value = found.node.title || '';
      fldDesc.value = found.node.description || '';
      fldNote.value = found.node.notes || '';
      fldImg.value = found.node.imageUrl || '';
      fldLink.value = found.node.linkUrl || '';
      modal.style.display = 'flex';
    }

    function closeEditor() {
      state.editingId = null;
      modal.style.display = 'none';
    }

    btnSave.onclick = () => {
      if (!state.editingId) return;
      const found = findWithParent(state.tree, state.editingId);
      if (!found) return;
      found.node.title = fldTitle.value || '未命名';
      found.node.description = fldDesc.value || '';
      found.node.notes = fldNote.value || '';
      found.node.imageUrl = fldImg.value || '';
      found.node.linkUrl = fldLink.value || '';
      persist();
      closeEditor();
      render();
    };
    btnCancel.onclick = closeEditor;
    modal.addEventListener('click', (e) => { if (e.target === modal) closeEditor(); });

    function createElement(tag, attrs = {}, children = []) {
      const el = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v]) => {
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (typeof v === 'function' && k.startsWith('on')) el[k] = v;
        else el.setAttribute(k, v);
      });
      [].concat(children).forEach(c => { if (c) el.appendChild(c); });
      return el;
    }

    function renderNode(node, depth = 0) {
      const container = createElement('div', { class: 'node' });
      const card = createElement('div', { class: 'card' });

      const titleRow = createElement('div', { class: 'title-row' });
      const toggleBtn = createElement('button', { class: 'ghost', style: 'padding:6px 10px;' });
      toggleBtn.textContent = node.isOpen ? '▼' : '▶';
      toggleBtn.onclick = () => toggleOpen(node.id);
      titleRow.appendChild(toggleBtn);

      const titleWrap = createElement('div');
      const title = createElement('p', { class: 'title', text: node.title });
      const subtitle = createElement('p', { class: 'muted', text: node.type || 'step' });
      subtitle.style.margin = '2px 0 0 0';
      titleWrap.appendChild(title);
      titleWrap.appendChild(subtitle);
      titleRow.appendChild(titleWrap);

      card.appendChild(titleRow);

      if (node.isOpen) {
        if (node.description) {
          card.appendChild(createElement('div', { class: 'body', text: node.description }));
        }
        if (node.notes) {
          const note = createElement('div', { class: 'note' });
          note.textContent = node.notes;
          card.appendChild(note);
        }
        if (node.imageUrl) {
          const img = createElement('img', { src: node.imageUrl, alt: 'preview', style: 'max-width:100%; border-radius:12px; border:1px solid #e2e8f0; margin-top:8px;' });
          card.appendChild(img);
        }
        if (node.linkUrl) {
          const link = createElement('a', { href: node.linkUrl, target: '_blank', style: 'display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-weight:600; color: var(--accent); text-decoration:none;' });
          link.textContent = '相關連結';
          card.appendChild(link);
        }
        const actions = createElement('div', { class: 'actions' });
        actions.appendChild(createElement('button', { class: 'primary' , text: '編輯' , onclick: () => openEditor(node.id) }));
        actions.appendChild(createElement('button', { text: '新增子區塊', onclick: () => addChild(node.id) }));
        if (node.id !== state.tree.id) actions.appendChild(createElement('button', { text: '新增同級', onclick: () => addSibling(node.id) }));
        if (node.id !== state.tree.id) actions.appendChild(createElement('button', { class: 'danger', text: '刪除', onclick: () => deleteNode(node.id) }));
        card.appendChild(actions);
      }

      container.appendChild(card);
      if (node.isOpen && node.children && node.children.length) {
        const childrenWrap = createElement('div', { class: 'children' });
        node.children.forEach(child => childrenWrap.appendChild(renderNode(child, depth + 1)));
        container.appendChild(childrenWrap);
      }
      return container;
    }

    function render() {
      treeRoot.innerHTML = '';
      treeRoot.appendChild(renderNode(state.tree));
      tipBadge.style.display = 'none';
    }

    // toolbar
    document.getElementById('btnAddRootChild').onclick = () => addChild(state.tree.id);
    document.getElementById('btnExport').onclick = () => {
      const blob = new Blob([JSON.stringify(state.tree, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sop_tree.json';
      a.click();
      URL.revokeObjectURL(url);
    };
    document.getElementById('importFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || typeof parsed !== 'object') throw new Error('invalid');
          state.tree = parsed;
          persist();
          render();
        } catch (err) {
          alert('匯入失敗：檔案格式錯誤');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };
    document.getElementById('btnReset').onclick = () => {
      if (!confirm('確定清除本機資料並回到預設流程？')) return;
      state.tree = JSON.parse(JSON.stringify(initialData));
      persist();
      render();
    };

    // init
    persist();
    render();
  </script>
</body>
</html>
