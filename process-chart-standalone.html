<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Process Chart (Standalone)</title>
    <style>
:root {
  color-scheme: light;
  font-family: "Inter", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background: #f8fafc;
  color: #0f172a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef2f7;
}

.app-header {
  padding: 1.5rem 2rem;
  background: linear-gradient(120deg, #1d4ed8, #2563eb, #60a5fa);
  color: #fff;
  border-bottom: 4px solid #1e3a8a;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
}

.branding {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.25rem;
}

.brand-icon {
  font-size: 1.5rem;
}

.subtitle {
  margin: 0;
  opacity: 0.9;
}

.app {
  padding: 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}

.node {
  background: #fff;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  padding: 1rem 1.25rem;
  margin-bottom: 1rem;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
}

.node__header {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
  flex-wrap: wrap;
}

.node__titles h2 {
  margin: 0;
  font-size: 1.2rem;
}

.node__titles p {
  margin: 0.15rem 0 0;
  color: #475569;
  font-weight: 600;
}

.node__actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.node__content {
  margin: 0.75rem 0 0.25rem;
  display: grid;
  gap: 0.75rem;
  grid-template-columns: 1fr;
}

.node__children {
  margin-top: 0.75rem;
  padding-left: 0.5rem;
  border-left: 3px solid #e2e8f0;
}

.field {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 0.75rem;
}

.field__label {
  font-size: 0.9rem;
  font-weight: 700;
  color: #475569;
  margin-bottom: 0.35rem;
}

.field__value {
  margin: 0;
  white-space: pre-line;
  color: #0f172a;
  line-height: 1.55;
}

.notes {
  background: #fdf2f8;
  border-color: #f9a8d4;
}

.button {
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 0.45rem 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
}

.button:active {
  transform: translateY(1px);
}

.button--primary {
  background: #2563eb;
  color: #fff;
  border-color: #1d4ed8;
  box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
}

.button--danger {
  background: #fee2e2;
  color: #b91c1c;
  border-color: #ef4444;
  box-shadow: 0 8px 16px rgba(239, 68, 68, 0.2);
}

.button--ghost {
  background: #e2e8f0;
  color: #0f172a;
  border-color: #cbd5e1;
}

.button--secondary {
  background: #f8fafc;
  color: #0f172a;
  border-color: #cbd5e1;
}

.form {
  background: #0f172a;
  color: #e2e8f0;
  padding: 1rem;
  border-radius: 12px;
  margin-top: 0.75rem;
  display: grid;
  gap: 0.75rem;
}

.form__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 0.75rem;
}

.form label {
  font-weight: 700;
  display: block;
  margin-bottom: 0.3rem;
}

.form input,
.form select,
.form textarea {
  width: 100%;
  padding: 0.55rem 0.65rem;
  border-radius: 8px;
  border: 1px solid #1f2937;
  background: #111827;
  color: #e5e7eb;
  font-size: 0.95rem;
  font-family: inherit;
}

.form textarea {
  min-height: 84px;
  resize: vertical;
}

.form__actions {
  display: flex;
  gap: 0.5rem;
  justify-content: flex-end;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: #e0f2fe;
  color: #075985;
  border: 1px solid #7dd3fc;
  border-radius: 999px;
  padding: 0.35rem 0.7rem;
  font-size: 0.85rem;
  font-weight: 700;
}

.layout-vertical .node__content {
  grid-template-columns: 1fr;
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-top: 0.5rem;
}

.helper-text {
  margin: 0;
  font-size: 0.9rem;
  color: #94a3b8;
}

.layout-picker {
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 0.75rem;
}

.layout-picker legend {
  font-weight: 800;
  padding: 0 0.35rem;
}

.layout-picker__hint {
  margin: 0.15rem 0 0.6rem;
  font-size: 0.9rem;
  color: #cbd5e1;
}

.layout-picker__list {
  display: grid;
  gap: 0.5rem;
}

.layout-option {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  background: #111827;
  border: 1px solid #1f2937;
  padding: 0.65rem 0.75rem;
  border-radius: 10px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.layout-option:hover {
  border-color: #2563eb;
  background: #0f172a;
}

.layout-option input {
  width: 1.1rem;
  height: 1.1rem;
  margin-top: 0.2rem;
}

.layout-option__title {
  font-weight: 800;
}

.layout-option__desc {
  color: #cbd5e1;
  margin-top: 0.1rem;
}

.field-group {
  display: grid;
  gap: 0.75rem;
}

.fields-vertical {
  grid-template-columns: 1fr;
}

.fields-side-notes {
  grid-template-columns: 2fr 1fr;
  grid-template-areas:
    "title title"
    "description notes";
}

.fields-side-notes .field--title {
  grid-area: title;
}

.fields-side-notes .field--description {
  grid-area: description;
}

.fields-side-notes .field--notes {
  grid-area: notes;
}

    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="branding">
        <span class="brand-icon">📦</span>
        <h1>Process Chart Editor</h1>
      </div>
      <p class="subtitle">支援多欄位版面配置與換行顯示的流程維護工具</p>
    </header>
    <main id="app" class="app"></main>
    <template id="node-template">
      <section class="node">

          </div>
          <div class="node__actions">
            <button class="button button--ghost" data-action="toggle"></button>
            <button class="button button--primary" data-action="edit">編輯</button>
            <button class="button button--danger" data-action="delete">刪除</button>
          </div>
        </div>
        <div class="node__content"></div>
        <div class="node__form"></div>
        <div class="node__children"></div>
      </section>
    </template>

              id: "p-step9",
              title: "⑨ 完成驗收",
              description: "點選「入庫」完成系統驗收作業。",
              type: "step",
              isOpen: false,
              layout: "vertical",
              style: {
                bgColor: "bg-white",
                borderColor: "border-slate-200",
                fontFamily: "font-sans",
                titleSize: "text-lg",
                contentSize: "text-base",
              },
              children: [],
            },
          ],
        },
      ],
    },
    {
      id: "node-h99txb4",
      title: "新子區塊",
      description: "請填寫說明...",
      type: "step",
      isOpen: true,
      layout: "vertical",
      style: {
        bgColor: "bg-white",
        borderColor: "border-slate-200",
        fontFamily: "font-sans",
        titleSize: "text-lg",
        contentSize: "text-base",
      },
      children: [],
    },
  ],
};

window.layoutOptions = [
  {
    value: "vertical",
    label: "直向堆疊",
    description: "說明在上、注意事項在下，保持條列分明。",
  },
  {
    value: "side-notes",
    label: "左右分欄",
    description: "說明在左、注意事項在右，便於對照重點。",
  },
];

    </script>
    <script>
const { layoutOptions, processData } = window;

const app = document.querySelector("#app");
const nodeTemplate = document.querySelector("#node-template");

const layoutLabels = layoutOptions.reduce((map, option) => {
  map[option.value] = option.label;
  return map;
}, {});

function cloneDeep(node) {
  return JSON.parse(JSON.stringify(node));
}

function applyLayoutDefaults(node) {
  if (!node.layout) node.layout = "vertical";
  node.children?.forEach(applyLayoutDefaults);
}

function createField(label, value, extraClass = "") {
  if (!value) return null;
  const wrapper = document.createElement("div");
  wrapper.className = `field ${extraClass}`;

  const title = document.createElement("div");
  title.className = "field__label";
  title.textContent = label;

  const content = document.createElement("p");
  content.className = "field__value";
  content.textContent = value;

  wrapper.append(title, content);
  return wrapper;
}

function createBadge(text) {
  const badge = document.createElement("span");
  badge.className = "tag";
  badge.textContent = text;
  return badge;
}

function renderForm(node, onSubmit, onCancel) {
  const form = document.createElement("form");
  form.className = "form";

  const helper = document.createElement("p");
  helper.className = "helper-text";
  helper.textContent = "按 Enter 會留下換行，預覽時會依版面配置正確分行。";

  const grid = document.createElement("div");
  grid.className = "form__grid";

  const titleField = createInputField("標題", "title", node.title, "text");
  const typeField = createInputField("類型", "type", node.type || "", "text");
  const layoutField = createLayoutField(node.layout);
  const descField = createTextAreaField("說明", "description", node.description || "");
  const notesField = createTextAreaField("注意事項", "notes", node.notes || "");

  grid.append(titleField, typeField, layoutField, descField, notesField);

  const actions = document.createElement("div");
  actions.className = "form__actions";

  const cancelButton = document.createElement("button");
  cancelButton.type = "button";
  cancelButton.className = "button button--secondary";
  cancelButton.textContent = "取消";
  cancelButton.addEventListener("click", onCancel);

  const saveButton = document.createElement("button");
  saveButton.type = "submit";
  saveButton.className = "button button--primary";
  saveButton.textContent = "儲存";

  actions.append(cancelButton, saveButton);
  form.append(helper, grid, actions);

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const data = new FormData(form);
    onSubmit({
      title: data.get("title"),
      type: data.get("type"),
      description: data.get("description"),
      notes: data.get("notes"),
      layout: data.get("layout"),
    });
  });

  return form;
}

function createInputField(label, name, value, type = "text") {
  const wrapper = document.createElement("label");
  wrapper.textContent = label;

  const input = document.createElement("input");
  input.name = name;
  input.type = type;
  input.value = value ?? "";

  wrapper.append(input);
  return wrapper;
}

function createTextAreaField(label, name, value) {
  const wrapper = document.createElement("label");
  const textarea = document.createElement("textarea");
  textarea.name = name;
  textarea.value = value ?? "";
  textarea.rows = 3;
  wrapper.append(label, textarea);
  return wrapper;
}

function createLayoutField(value) {
  const wrapper = document.createElement("fieldset");
  wrapper.className = "layout-picker";

  const legend = document.createElement("legend");
  legend.textContent = "欄位版面配置";

  const helper = document.createElement("p");
  helper.className = "layout-picker__hint";
  helper.textContent = "標題固定置頂，僅調整「說明」「注意事項」的呈現方式。";

  const list = document.createElement("div");
  list.className = "layout-picker__list";

  layoutOptions.forEach((option) => {
    const label = document.createElement("label");
    label.className = "layout-option";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "layout";
    input.value = option.value;
    input.checked = option.value === value;

    const content = document.createElement("div");
    content.className = "layout-option__body";

    const title = document.createElement("div");
    title.className = "layout-option__title";
    title.textContent = option.label;

    const desc = document.createElement("div");
    desc.className = "layout-option__desc";
    desc.textContent = option.description;

    content.append(title, desc);
    label.append(input, content);
    list.append(label);
  });

  wrapper.append(legend, helper, list);
  return wrapper;
}

function renderNode(node, container, parent) {
  const element = nodeTemplate.content.firstElementChild.cloneNode(true);
  element.classList.add(`layout-${node.layout}`);

  const titleEl = element.querySelector(".node__title");
  titleEl.textContent = node.title;

  const typeEl = element.querySelector(".node__type");
  typeEl.textContent = node.type;

  const toggleBtn = element.querySelector('[data-action="toggle"]');
  toggleBtn.textContent = node.isOpen ? "收合" : "展開";

  const content = element.querySelector(".node__content");

  const badgeRow = document.createElement("div");
  badgeRow.className = "badge-row";
  badgeRow.append(createBadge(layoutLabels[node.layout] || "自訂版面"));
  content.append(badgeRow);

  const fieldsWrap = document.createElement("div");
  fieldsWrap.className = `field-group fields-${node.layout}`;

  const titleField = createField("標題", node.title, "field--stacked field--title");
  const descriptionField = createField("說明", node.description, "field--description");
  const notesField = createField("注意事項", node.notes, "notes field--notes");

  if (titleField) fieldsWrap.append(titleField);
  if (descriptionField) fieldsWrap.append(descriptionField);
  if (notesField) fieldsWrap.append(notesField);

  content.append(fieldsWrap);

  const childrenContainer = element.querySelector(".node__children");
  const formContainer = element.querySelector(".node__form");

  toggleBtn.addEventListener("click", () => {
    node.isOpen = !node.isOpen;
    render();
  });

  const editBtn = element.querySelector('[data-action="edit"]');
  let isEditing = false;

  const cancelForm = () => {
    isEditing = false;
    formContainer.innerHTML = "";
  };

  const submitForm = (updates) => {
    Object.assign(node, updates);
    isEditing = false;
    render();
  };

  editBtn.addEventListener("click", () => {
    isEditing = !isEditing;
    if (isEditing) {
      const form = renderForm(node, submitForm, cancelForm);
      formContainer.innerHTML = "";
      formContainer.append(form);
    } else {
      cancelForm();
    }
  });

  const deleteBtn = element.querySelector('[data-action="delete"]');
  if (!parent) {
    deleteBtn.disabled = true;
    deleteBtn.title = "根節點無法刪除";
  }

  deleteBtn.addEventListener("click", () => {
    if (!parent) return;
    const confirmed = window.confirm(`確定要刪除「${node.title}」嗎？`);
    if (!confirmed) return;
    parent.children = parent.children.filter((child) => child !== node);
    render();
  });

  if (!node.isOpen) {
    element.querySelector(".node__content").style.display = "none";
    element.querySelector(".node__children").style.display = "none";
  }

  if (node.children && node.children.length) {
    node.children.forEach((child) => renderNode(child, childrenContainer, node));
  }

  container.append(element);
}

function render() {
  app.innerHTML = "";
  renderNode(processState, app, null);
}

const processState = cloneDeep(processData);
applyLayoutDefaults(processState);
render();

    </script>
  </body>
</html>
