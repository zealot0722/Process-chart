:root {
  color-scheme: light;
  font-family: "Inter", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background: #f8fafc;
  color: #0f172a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef2f7;
}

.app-shell {
  min-height: 100vh;
}

.app-header {
  padding: 1.5rem 2rem;
  background: linear-gradient(120deg, #1d4ed8, #2563eb, #60a5fa);
  color: #fff;
  border-bottom: 4px solid #1e3a8a;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
}

.branding {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.25rem;
}

.brand-icon {
  font-size: 1.5rem;
}

.subtitle {
  margin: 0;
  opacity: 0.9;
}

.app {
  padding: 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}

.node {
  --accent: #cbd5e1;
  --indent: 0px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-left: 8px solid var(--accent);
  border-radius: 12px;
  padding: 1rem 1.25rem 1.1rem;
  margin-bottom: 1rem;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
  position: relative;
  margin-left: var(--indent);
}

.node__header {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
  flex-wrap: wrap;
  padding-bottom: 0.4rem;
  border-bottom: 1px dashed #e2e8f0;
}

.node__titles h2 {
  margin: 0;
  font-size: 1.2rem;
  color: #0f172a;
  padding: 0.2rem 0.4rem;
  border-radius: 8px;
  transition: background 0.15s ease;
}

.node__titles p {
  margin: 0.15rem 0 0;
  color: #475569;
  font-weight: 600;
  padding: 0.15rem 0.35rem;
  border-radius: 6px;
}

.node__titles h2[contenteditable="true"],
.node__titles p[contenteditable="true"] {
  outline: none;
  border: 1px dashed transparent;
}

.node__titles h2[contenteditable="true"]:focus,
.node__titles p[contenteditable="true"]:focus {
  background: #e0f2fe;
  border-color: #38bdf8;
}

.node[data-depth="0"] {
  background: #f8fafc;
}

.node::before {
  content: "";
  position: absolute;
  left: -14px;
  top: 0.85rem;
  bottom: 0.85rem;
  width: 2px;
  background: linear-gradient(#e2e8f0, #e2e8f0);
  opacity: 0.85;
}

.node[data-depth="0"]::before {
  display: none;
}

.node__actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.node__content {
  margin: 0.8rem 0 0.25rem;
  display: grid;
  gap: 0.75rem;
  grid-template-columns: 1fr;
}

.node__children {
  margin-top: 0.75rem;
  display: grid;
  gap: 0.5rem;
}

.field {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 0.8rem;
}

.field__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.field__label {
  font-size: 0.95rem;
  font-weight: 800;
  color: #0f172a;
  display: flex;
  gap: 0.35rem;
  align-items: center;
}

.field__hint {
  color: #94a3b8;
  font-size: 0.85rem;
}

.field__value {
  margin: 0;
  white-space: pre-line;
  color: #0f172a;
  line-height: 1.55;
}

.field--editable {
  border-style: dashed;
}

.field--link {
  background: #eef2ff;
  border-color: #cbd5ff;
}

.notes {
  background: #fdf2f8;
  border-color: #f9a8d4;
}

.button {
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 0.45rem 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
}

.button:active {
  transform: translateY(1px);
}

.button--primary {
  background: #2563eb;
  color: #fff;
  border-color: #1d4ed8;
  box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
}

.button--danger {
  background: #fee2e2;
  color: #b91c1c;
  border-color: #ef4444;
  box-shadow: 0 8px 16px rgba(239, 68, 68, 0.2);
}

.button--ghost {
  background: #e2e8f0;
  color: #0f172a;
  border-color: #cbd5e1;
}

.button--secondary {
  background: #f8fafc;
  color: #0f172a;
  border-color: #cbd5e1;
}

.inline-input,
.inline-select,
textarea.inline-input {
  width: 100%;
  padding: 0.55rem 0.65rem;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
  background: #fff;
  color: #0f172a;
  font-size: 0.95rem;
  font-family: inherit;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.inline-input:focus,
.inline-select:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

textarea.inline-input {
  min-height: 88px;
  resize: vertical;
}

.layout-vertical .node__content {
  grid-template-columns: 1fr;
}

.helper-text {
  margin: 0;
  font-size: 0.9rem;
  color: #94a3b8;
}

.layout-picker {
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 0.75rem;
  background: #fff;
}

.layout-picker legend {
  font-weight: 800;
  padding: 0 0.35rem;
}

.layout-picker__hint {
  margin: 0.15rem 0 0.6rem;
  font-size: 0.9rem;
  color: #475569;
}

.layout-picker__list {
  display: grid;
  gap: 0.5rem;
}

.layout-option__preview {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.35rem;
  margin-top: 0.35rem;
}

.preview-side-notes {
  grid-template-columns: 1.15fr 0.85fr;
}

.layout-option__preview span {
  display: block;
  padding: 0.35rem 0.45rem;
  border-radius: 6px;
  font-size: 0.85rem;
  text-align: center;
}

.preview__desc {
  background: #1d4ed8;
  color: #e0e7ff;
}

.preview__note {
  background: #c026d3;
  color: #f8e8ff;
}

.layout-option {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 0.65rem 0.75rem;
  border-radius: 10px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.layout-option:hover {
  border-color: #2563eb;
  background: #eff6ff;
}

.layout-option input {
  width: 1.1rem;
  height: 1.1rem;
  margin-top: 0.2rem;
}

.layout-option__title {
  font-weight: 800;
}

.layout-option__desc {
  color: #475569;
  margin-top: 0.1rem;
}

.field-group {
  display: grid;
  gap: 0.75rem;
}

.fields-vertical {
  grid-template-columns: 1fr;
}

.fields-side-notes {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.85fr);
}

.meta-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 0.65rem;
}

.icon-button {
  border: 1px solid #cbd5e1;
  background: #fff;
  color: #0f172a;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 800;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s ease, border-color 0.12s ease;
}

.icon-button:hover {
  background: #eff6ff;
  border-color: #2563eb;
}

.icon-button--remove {
  background: #fef2f2;
  border-color: #fecdd3;
  color: #b91c1c;
}

.icon-button--remove:hover {
  background: #fee2e2;
  border-color: #fca5a5;
}

.field-list {
  display: grid;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.field-list__item {
  display: grid;
  gap: 0.4rem;
  grid-template-columns: 1fr auto;
  align-items: start;
  padding: 0.6rem 0.55rem;
  border: 1px dashed #e2e8f0;
  border-radius: 10px;
  background: #fff;
}

.field-list__controls {
  display: flex;
  justify-content: flex-end;
}

.media-preview {
  grid-column: 1 / -1;
  margin-top: 0.15rem;
  background: #f8fafc;
  border: 1px dashed #cbd5e1;
  border-radius: 10px;
  padding: 0.5rem;
}

.media-preview img {
  max-width: 100%;
  display: block;
  border-radius: 8px;
}

.link-preview {
  grid-column: 1 / -1;
  color: #2563eb;
  word-break: break-all;
  text-decoration: none;
  font-weight: 700;
}

.link-preview:hover {
  text-decoration: underline;
}

  {
    value: "vertical",
    label: "單欄排列",
    description: "說明在上、注意事項在下，保持條列分明。",
  },
  {
    value: "side-notes",
    label: "左右分欄",
    description: "說明在左、注意事項在右，便於對照重點。",
  },

    </script>
    <script>
const { layoutOptions, processData } = window;

const app = document.querySelector("#app");
const nodeTemplate = document.querySelector("#node-template");

const accentPalette = ["#2563eb", "#0ea5e9", "#22c55e", "#a855f7", "#f97316", "#ec4899"];

function cloneDeep(node) {
  return JSON.parse(JSON.stringify(node));
}

function applyLayoutDefaults(node) {
  if (!node.layout) node.layout = "vertical";
  if (!node.images) node.images = [];
  if (!node.links) node.links = [];
  node.children?.forEach(applyLayoutDefaults);
}

function getAccent(depth) {
  return accentPalette[depth % accentPalette.length];
}

function createEditableText(label, value, onChange, options = {}) {
  const { multiline = false, placeholder = "" } = options;
  const wrapper = document.createElement("div");
  wrapper.className = "field field--editable";

  const header = document.createElement("div");
  header.className = "field__header";
  const lbl = document.createElement("div");
  lbl.className = "field__label";
  lbl.textContent = label;
  const hint = document.createElement("span");
  hint.className = "field__hint";
  hint.textContent = "可直接編輯";
  header.append(lbl, hint);

  const inputEl = multiline ? document.createElement("textarea") : document.createElement("input");
  inputEl.value = value || "";
  inputEl.placeholder = placeholder;
  inputEl.className = "inline-input";
  if (multiline) {
    inputEl.rows = 3;
  }

  inputEl.addEventListener("input", (event) => {
    onChange(event.target.value);
  });

  wrapper.append(header, inputEl);
  return wrapper;
}

function createLayoutSelector(node) {
  const wrapper = document.createElement("div");
  wrapper.className = "field field--layout";

  const header = document.createElement("div");
  header.className = "field__header";
  const label = document.createElement("div");
  label.className = "field__label";
  label.textContent = "欄位版面配置";
  header.append(label);

  const select = document.createElement("select");
  select.className = "inline-select";

  layoutOptions.forEach((option) => {
    const opt = document.createElement("option");
    opt.value = option.value;
    opt.textContent = `${option.label} — ${option.description}`;
    if (node.layout === option.value) opt.selected = true;
    select.append(opt);
  });

  select.addEventListener("change", (event) => {
    node.layout = event.target.value;
    render();
  });

  wrapper.append(header, select);
  return wrapper;
}

function createListField(label, items, onAdd, onUpdate, onRemove, options = {}) {
  const { type = "link" } = options;
  const wrapper = document.createElement("div");
  wrapper.className = `field field--editable field--list field--${type}`;

  const header = document.createElement("div");
  header.className = "field__header";
  const lbl = document.createElement("div");
  lbl.className = "field__label";
  lbl.textContent = label;

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "icon-button icon-button--add";
  addBtn.title = `新增${label}`;
  addBtn.textContent = "+";
  addBtn.addEventListener("click", onAdd);

  header.append(lbl, addBtn);
  wrapper.append(header);

  const list = document.createElement("div");
  list.className = "field-list";

  items.forEach((value, index) => {
    const itemRow = document.createElement("div");
    itemRow.className = "field-list__item";

    const input = document.createElement("input");
    input.type = "url";
    input.value = value || "";
    input.placeholder = type === "image" ? "https://... (圖片網址)" : "https://... (參考網址)";
    input.className = "inline-input";

    input.addEventListener("input", (event) => {
      onUpdate(index, event.target.value);
    });

    const controls = document.createElement("div");
    controls.className = "field-list__controls";

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "icon-button icon-button--remove";
    removeBtn.title = "刪除欄位";
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", () => onRemove(index));

    controls.append(removeBtn);
    itemRow.append(input, controls);

    if (type === "image" && value) {
      const preview = document.createElement("div");
      preview.className = "media-preview";
      const img = document.createElement("img");
      img.src = value;
      img.alt = "圖片預覽";
      preview.append(img);
      itemRow.append(preview);
    }

    if (type === "link" && value) {
      const previewLink = document.createElement("a");
      previewLink.href = value;
      previewLink.target = "_blank";
      previewLink.rel = "noreferrer";
      previewLink.className = "link-preview";
      previewLink.textContent = value;
      itemRow.append(previewLink);
    }

    list.append(itemRow);
  });

  wrapper.append(list);
  return wrapper;
}

function renderNode(node, container, parent, depth = 0) {
  const element = nodeTemplate.content.firstElementChild.cloneNode(true);
  element.classList.add(`layout-${node.layout}`);
  element.style.setProperty("--accent", getAccent(depth));
  element.style.setProperty("--indent", `${depth * 18}px`);
  element.dataset.depth = depth;

  const titleEl = element.querySelector(".node__title");
  titleEl.textContent = node.title;
  titleEl.contentEditable = true;
  titleEl.spellcheck = false;
  titleEl.addEventListener("input", (event) => {
    node.title = event.target.textContent;
  });

  const typeEl = element.querySelector(".node__type");
  typeEl.textContent = node.type || "";
  typeEl.contentEditable = true;
  typeEl.spellcheck = false;
  typeEl.addEventListener("input", (event) => {
    node.type = event.target.textContent;
  });

  const toggleBtn = element.querySelector('[data-action="toggle"]');
  toggleBtn.textContent = node.isOpen ? "收合" : "展開";

  const content = element.querySelector(".node__content");
  const childrenContainer = element.querySelector(".node__children");

  const metaRow = document.createElement("div");
  metaRow.className = "meta-row";
  metaRow.append(createLayoutSelector(node));
  content.append(metaRow);

  const fieldsWrap = document.createElement("div");
  fieldsWrap.className = `field-group fields-${node.layout}`;

  const descriptionField = createEditableText("說明", node.description, (value) => {
    node.description = value;
  }, { multiline: true, placeholder: "輸入說明..." });

  const notesField = createEditableText("注意事項", node.notes, (value) => {
    node.notes = value;
  }, { multiline: true, placeholder: "輸入注意事項..." });

  fieldsWrap.append(descriptionField, notesField);
  content.append(fieldsWrap);

  const mediaWrap = document.createElement("div");
  mediaWrap.className = `field-group fields-${node.layout}`;

  const imageField = createListField(
    "圖片網址",
    node.images,
    () => {
      node.images.push("");
      render();
    },
    (index, value) => {
      node.images[index] = value;
    },
    (index) => {
      node.images.splice(index, 1);
      render();
    },
    { type: "image" }
  );

  const linkField = createListField(
    "參考網址",
    node.links,
    () => {
      node.links.push("");
      render();
    },
    (index, value) => {
      node.links[index] = value;
    },
    (index) => {
      node.links.splice(index, 1);
      render();
    },
    { type: "link" }
  );

  mediaWrap.append(imageField, linkField);
  content.append(mediaWrap);

  toggleBtn.addEventListener("click", () => {
    node.isOpen = !node.isOpen;
    render();
  });

  const deleteBtn = element.querySelector('[data-action="delete"]');
  if (!parent) {
    deleteBtn.disabled = true;
    deleteBtn.title = "根節點無法刪除";
  }

  deleteBtn.addEventListener("click", () => {
    if (!parent) return;
    const confirmed = window.confirm(`確定要刪除「${node.title}」嗎？`);
    if (!confirmed) return;
    parent.children = parent.children.filter((child) => child !== node);
    render();
  });

  if (!node.isOpen) {
    element.querySelector(".node__content").style.display = "none";
    element.querySelector(".node__children").style.display = "none";
  }

  if (node.children && node.children.length) {
    node.children.forEach((child) => renderNode(child, childrenContainer, node, depth + 1));
  }

  container.append(element);
}

function render() {
  app.innerHTML = "";
  renderNode(processState, app, null, 0);
}

const processState = cloneDeep(processData);
applyLayoutDefaults(processState);
render();
    </script>
